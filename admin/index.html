<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>CMS | Anton Danshin's Blog</title>
  </head>
  <body>
    <!-- Sveltia CMS reads its configuration from ./config.yml -->
    <script src="https://unpkg.com/@sveltia/cms@0.256.1/dist/sveltia-cms.js"></script>
    <script>
      CMS.registerPreviewStyle(
        "https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/index.css"
      )
      CMS.registerPreviewStyle(
        "https://cdn.jsdelivr.net/npm/@fontsource-variable/inter@5.3.0/wght-italic.css"
      )
      CMS.registerPreviewStyle("/admin/preview.css")
    </script>
  </body>
</html>
